name: ${COMPOSE_PROJECT_NAME:-humanoid-lab}

services:
  dev:
    image: humanoid-lab/dev:${ISAAC_SIM_TAG:-5.1.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ISAAC_SIM_IMAGE: ${ISAAC_SIM_IMAGE:-nvcr.io/nvidia/isaac-sim}
        ISAAC_SIM_TAG: ${ISAAC_SIM_TAG:-5.1.0}
        ISAAC_SIM_DIGEST: ${ISAAC_SIM_DIGEST:-UNSET_DIGEST}
        UV_VERSION: ${UV_VERSION:-0.12.9}
        UV_SHA256: ${UV_SHA256:-UNSET_UV_SHA256}
        ISAAC_LAB_COMMIT: ${REPOSITORIES_ISAAC_LAB_COMMIT:?render versions.lock.yaml first}
        SONIC_COMMIT: ${REPOSITORIES_SONIC_COMMIT:?render versions.lock.yaml first}
        ISAAC_GROOT_COMMIT: ${REPOSITORIES_ISAAC_GROOT_COMMIT:?render versions.lock.yaml first}
        DEVELOPER_UID: ${DEVELOPER_UID:-1000}
        DEVELOPER_GID: ${DEVELOPER_GID:-1000}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: ${COMPOSE_PROJECT_NAME:-humanoid-lab}-dev
    hostname: humanoid-lab-dev
    environment:
      - ACCEPT_EULA=${ACCEPT_EULA:-N}
      - PRIVACY_CONSENT=${PRIVACY_CONSENT:-N}
      - DISPLAY=${DISPLAY:-:0}
      # Host networking is needed for Isaac, but simulation DDS is separately
      # constrained to loopback by cyclonedds-sim.xml and the SONIC patch.
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      - CYCLONEDDS_URI=file:///opt/humanoid-lab/cyclonedds-sim.xml
      - HUMANOID_SIM_DDS_DOMAIN_ID=42
      - HUMANOID_DATA_ROOT=/data
      - HUMANOID_SOURCE_ROOT=/workspace/humanoid-lab
      - HF_HOME=/cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/cache/huggingface/hub
      - UV_CACHE_DIR=/cache/uv
      - ISAAC_CACHE_PATH=/cache/isaac
      - OV_CACHE_PATH=/cache/isaac/ov
      - PIP_CACHE_DIR=/cache/isaac/pip
      - GL_CACHE_PATH=/cache/isaac/glcache
      - COMPUTE_CACHE_PATH=/cache/isaac/computecache
    volumes:
      - ${HUMANOID_SOURCE_ROOT:?set HUMANOID_SOURCE_ROOT in .env}:/workspace/humanoid-lab
      - ${HUMANOID_DATA_ROOT:?set HUMANOID_DATA_ROOT in .env}/datasets:/data/datasets
      - ${HUMANOID_DATA_ROOT:?set HUMANOID_DATA_ROOT in .env}/checkpoints:/data/checkpoints
      - ${HUMANOID_DATA_ROOT:?set HUMANOID_DATA_ROOT in .env}/models:/data/models
      - ${HUMANOID_DATA_ROOT:?set HUMANOID_DATA_ROOT in .env}/hf-cache:/cache/huggingface
      - ${HUMANOID_DATA_ROOT:?set HUMANOID_DATA_ROOT in .env}/uv-cache:/cache/uv
      # Lock-pinned venvs persist outside the image.  bootstrap-venvs.sh
      # provisions a missing env and updates only the env whose fingerprint changed.
      - ${HUMANOID_DATA_ROOT:?set HUMANOID_DATA_ROOT in .env}/venvs:/opt/venvs
      - ${HUMANOID_DATA_ROOT:?set HUMANOID_DATA_ROOT in .env}/isaac-cache:/cache/isaac
      # Isaac Sim 5.1 writes these under its install prefix.  The base image is
      # root-owned, so bind-mount every mutable location for the dev user.
      - ${HUMANOID_DATA_ROOT:?set HUMANOID_DATA_ROOT in .env}/isaac-cache/main:/isaac-sim/.cache:rw
      - ${HUMANOID_DATA_ROOT:?set HUMANOID_DATA_ROOT in .env}/isaac-cache/computecache:/isaac-sim/.nv/ComputeCache:rw
      - ${HUMANOID_DATA_ROOT:?set HUMANOID_DATA_ROOT in .env}/isaac-cache/logs:/isaac-sim/.nvidia-omniverse/logs:rw
      - ${HUMANOID_DATA_ROOT:?set HUMANOID_DATA_ROOT in .env}/isaac-cache/config:/isaac-sim/.nvidia-omniverse/config:rw
      - ${HUMANOID_DATA_ROOT:?set HUMANOID_DATA_ROOT in .env}/isaac-cache/data:/isaac-sim/.local/share/ov/data:rw
      - ${HUMANOID_DATA_ROOT:?set HUMANOID_DATA_ROOT in .env}/isaac-cache/pkg:/isaac-sim/.local/share/ov/pkg:rw
      # Isaac Lab's Python Kit experience also persists state below CARB_APP_PATH.
      - ${HUMANOID_DATA_ROOT:?set HUMANOID_DATA_ROOT in .env}/isaac-cache/kit-data:/isaac-sim/kit/data:rw
      - ${HUMANOID_DATA_ROOT:?set HUMANOID_DATA_ROOT in .env}/isaac-cache/kit-cache:/isaac-sim/kit/cache:rw
      - ${HUMANOID_DATA_ROOT:?set HUMANOID_DATA_ROOT in .env}/isaac-cache/kit-logs:/isaac-sim/kit/logs:rw
      - ${HUMANOID_DATA_ROOT:?set HUMANOID_DATA_ROOT in .env}/rosbags:/data/rosbags
      - ${HUMANOID_DATA_ROOT:?set HUMANOID_DATA_ROOT in .env}/outputs:/outputs
      - ${HUMANOID_DATA_ROOT:?set HUMANOID_DATA_ROOT in .env}/diagnostics:/data/diagnostics
      - ${HUMANOID_DATA_ROOT:?set HUMANOID_DATA_ROOT in .env}/runtime:/data/runtime:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # F310/joystick access for the SONIC input adapter.  The cgroup rule is
      # scoped to the input-event major rather than making the container
      # privileged; setup.sh writes the host input group's numeric GID.
      - /dev/input:/dev/input
    network_mode: host
    ipc: host
    device_cgroup_rules:
      - "c 13:* rwm"
    # /isaac-sim 750 isaac-sim; compose exec /etc/group supplemental group'ları çözmez
    group_add:
      - isaac-sim
      - ${HOST_INPUT_GID:?set HOST_INPUT_GID in .env}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -e
        exec /opt/humanoid-lab/shell.sh
    init: true
    stdin_open: true
    tty: true
    restart: unless-stopped
    stop_grace_period: 30s
