[project]
name = "humanoid-lab-psi0"
version = "0.0.0"
description = "Psi0 training environment (base + serve/viz/psi groups of third_party/Psi0)"
requires-python = "==3.11.*"
# Mirrors third_party/Psi0's pyproject: same direct dependencies, at the versions
# the upstream uv.lock resolved to. Two deliberate deltas:
#   * torch/torchvision resolve from the cu128 index (this GPU is sm_120); the
#     nvidia-* wheels follow that build instead of the cu126 set upstream locked.
#   * deepspeed is dropped. This runtime has no CUDA toolkit, so `import
#     deepspeed` aborts before accelerate can fall back to DDP, and the upstream
#     SONIC recipe trains with --train.data_parallel=ddp.
dependencies = [
    "albumentations==1.4.18",
    "datasets==3.6.0",
    "dm-tree==0.1.8",
    "einops==0.8.1",
    "einx==0.3.0",
    "h5py==3.14.0",
    "imageio==2.34.2",
    "jsonlines==4.0.0",
    "numpy==1.26.4",
    "numpydantic==1.6.7",
    "omegaconf==2.3.0",
    "opencv-python==4.11.0.86",
    "plotly==6.2.0",
    "pydantic==2.10.6",
    "pydantic-yaml==1.6.0",
    "tqdm==4.67.1",
    "typer==0.24.1",
    "tyro==0.9.32",
    "vuer[all]==0.0.68",
    "wandb[media]==0.25.0",
    "simplejpeg==1.9.0",
    "dotenv==0.9.9",
    "gdown==5.2.0",
    "decord2==3.3.0",
    # --group serve
    "fastapi==0.119.1",
    "uvicorn==0.38.0",
    # --group viz
    "transforms3d==0.4.2",
    "viser==1.0.15",
    "matplotlib==3.10.6",
    # --group psi
    "setuptools>=61",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "torchcodec==0.4.0",
    "transformers==4.57.1",
    "triton==3.3.0",
    "accelerate==1.7.0",
    "peft==0.17.1",
    "qwen-vl-utils==0.0.14",
    "sentencepiece==0.2.1",
    "evdev==1.6.1",
    "lerobot @ git+https://github.com/songlin/lerobot.git@09929d8057b044b53aecaf5c6d7eb71f99e8beb9",
]

[tool.uv]
package = false
# The rest of upstream's resolved graph, as constraints: they only bind packages
# that end up in this resolution, so the environment stays reproducible against
# the upstream lock without pinning anything this project does not use.
# Regenerated from third_party/Psi0/uv.lock; do not edit by hand.
